<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Zathura</title>
  </head>
  <body>
    <main aria-labelledby="reader-title">
      <aside id="outline" hidden aria-labelledby="outline-title">
        <h2 id="outline-title">Contents</h2>
        <div id="outline-tree"></div>
      </aside>
      <section id="empty-reader" class="empty-reader" tabindex="-1">
        <h1 id="reader-title">Zathura</h1>
        <p>No document open.</p>
        <p>Press Ctrl+O to open a PDF.</p>
      </section>
      <div id="reader" aria-label="PDF document" hidden></div>
    </main>
    <div id="command-bar" hidden>
      <span aria-hidden="true">:</span>
      <input id="command-input" type="text" autocomplete="off" spellcheck="false"
             aria-label="Reader command (for example q to close this document)" />
    </div>
    <ul id="file-results" aria-label="File opening feedback" hidden></ul>
    <footer role="status">
      <span id="status-name">No document open.</span>
      <span id="status-pages"></span>
    </footer>
    <dialog id="document-list" aria-labelledby="document-list-title">
      <h2 id="document-list-title">Open documents</h2>
      <div id="document-items" role="listbox" aria-label="Open documents"></div>
    </dialog>
    <dialog id="password-dialog" aria-labelledby="password-title" aria-describedby="password-message">
      <form id="password-form" method="dialog" class="dialog-content">
        <h2 id="password-title">Password required</h2>
        <p id="password-message">Enter this PDF's password.</p>
        <label for="pdf-password">PDF password</label>
        <input id="pdf-password" class="input" type="password" autocomplete="off" spellcheck="false" />
        <div class="dialog-actions">
          <button class="button" type="submit">Unlock PDF</button>
          <button id="cancel-password" class="button" type="button">Cancel</button>
        </div>
      </form>
    </dialog>
    <!-- Recolor filter: maps each page pixel's luminance onto the theme's
         canvas/text colors (flood colors come from tokens in CSS). Both color
         weights are masked by the source alpha so areas the canvas does not
         paint stay untouched, and the region is clipped to the canvas box. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="pdf-recolor" color-interpolation-filters="sRGB" x="0%" y="0%" width="100%" height="100%">
        <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="lum" />
        <feComponentTransfer in="lum" result="ink-lum">
          <feFuncA type="table" tableValues="1 0" />
        </feComponentTransfer>
        <feComposite in="lum" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="paper-weight" />
        <feComposite in="ink-lum" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="ink-weight" />
        <feFlood id="pdf-recolor-paper" result="paper-color" />
        <feComposite in="paper-color" in2="paper-weight" operator="in" result="paper" />
        <feFlood id="pdf-recolor-ink" result="ink-color" />
        <feComposite in="ink-color" in2="ink-weight" operator="in" result="ink" />
        <feComposite in="paper" in2="ink" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
      </filter>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
